log_format wincc_trace '$time_iso8601 request_id=$request_id client=$remote_addr '
                       'method=$request_method uri="$request_uri" status=$status '
                       'bytes=$body_bytes_sent referer="$http_referer" '
                       'user_agent="$http_user_agent" request_time=$request_time';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker logs expose all static-file and proxy requests for test-server diagnostics.
    access_log /dev/stdout wincc_trace;
    error_log /dev/stderr info;

    # The browser calls the same-origin /api path. The proxy reaches the backend
    # running on the Docker host at localhost:8080; the trailing slash strips /api.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket clients keep the browser's current host and route through Nginx.
    location /ws/ {
        # Do not use a trailing slash here: the backend endpoint includes /ws.
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next 静态导出为每个路由生成 HTML 文件。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带内容哈希的 Next 资源可以长期缓存；页面 HTML 保持即时更新。
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
