# Nginx reverse proxy for the Ruihai Next.js app.
# Replace server_name and upstream targets before deploying.
#
# Recommended frontend env when using this same-origin proxy:
#   NEXT_PUBLIC_API_MOCK_MODE=off
#   NEXT_PUBLIC_API_BASE_URL=
#   NEXT_PUBLIC_WS_BASE_URL=
#
# If the browser calls the API service directly instead, set:
#   NEXT_PUBLIC_API_MOCK_MODE=off
#   NEXT_PUBLIC_API_BASE_URL=https://api.example.com
#   NEXT_PUBLIC_WS_BASE_URL=wss://api.example.com
# and the REST/WS proxy locations below become optional.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ruihai_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ruihai_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream ruihai_ws {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Documented REST APIs:
    #   /temperature/trend
    #   /alarm/page
    #   /alarm/batch-process
    #   /alarm/stat-by-location
    #   /weekly/report/query
    #   /weekly/report/download
    #   /device/live
    location ~ ^/(temperature|alarm|weekly|device)(/|$) {
        proxy_pass http://ruihai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Documented WebSocket APIs:
    #   /ws/modbus
    #   /ws/business/alarm
    location /ws/ {
        proxy_pass http://ruihai_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://ruihai_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ruihai_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
